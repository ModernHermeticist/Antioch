name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to attach builds to releases on version tags

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev xvfb

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DANTIOCH_BUILD_TESTS=ON
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build VST3
        run: cmake --build build --config Release --target Antioch_VST3 --parallel

      - name: Run tests
        if: runner.os == 'Linux'
        run: |
          cmake --build build --config Release --target AntiochTests --parallel
          xvfb-run -a build/AntiochTests_artefacts/Release/AntiochTests test-output

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/Antioch_artefacts/Release/VST3/Antioch.vst3 dist/
          cp README.md dist/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../Antioch-${{ matrix.name }}-VST3.zip .
          else
            zip -r ../Antioch-${{ matrix.name }}-VST3.zip .
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Antioch-${{ matrix.name }}-VST3
          path: dist/

      - name: Upload test renders
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: test-renders
          path: test-output/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Antioch-${{ matrix.name }}-VST3.zip
