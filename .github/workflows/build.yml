name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to attach builds to releases on version tags

env:
  PLUGINS: Antioch Transmutation Correspondence Kybalion Vibration Mentalism Ouroboros SolveEtCoagula Quintessence
  # Former plugins merged into another (module:host): built into the host, tested on their own
  MODULES: Lapis:Mentalism EmeraldTablet:Correspondence PrimaMateria:Quintessence Azoth:Transmutation

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev xvfb

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUITE_BUILD_TESTS=ON
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build VST3s
        shell: bash
        run: |
          for p in $PLUGINS; do
            cmake --build build --config Release --target ${p}_VST3 --parallel
          done

      - name: Run tests
        if: runner.os == 'Linux'
        run: |
          for p in $PLUGINS; do
            cmake --build build --config Release --target ${p}Tests --parallel
            xvfb-run -a build/plugins/$p/${p}Tests_artefacts/Release/${p}Tests test-output
          done
          for mh in $MODULES; do
            m=${mh%%:*}; h=${mh##*:}
            cmake --build build --config Release --target ${m}Tests --parallel
            xvfb-run -a build/plugins/$h/${m}Tests_artefacts/Release/${m}Tests test-output
          done

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          for p in $PLUGINS; do
            cp -R build/plugins/$p/${p}_artefacts/Release/VST3/*.vst3 dist/
          done
          cp README.md dist/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../AntiochSuite-${{ matrix.name }}-VST3.zip .
          else
            zip -r ../AntiochSuite-${{ matrix.name }}-VST3.zip .
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AntiochSuite-${{ matrix.name }}-VST3
          path: dist/

      - name: Upload test renders
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: test-renders
          path: test-output/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AntiochSuite-${{ matrix.name }}-VST3.zip
